appId: be.sonicrocket.oli-cdn-demo
productName: o|i Lab

publish:
  provider: github
  owner: markminnoye
  repo: oli-electron
  releaseType: draft
copyright: Copyright © 2026 Sonic Rocket

directories:
  output: release
  buildResources: build

# Icon will be automatically picked up from build/oli-electron.png
icon: build/oli-electron.png

files:
  - dist/**/*
  - app/app/dist/**/*
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/.bin"

mac:
  category: public.app-category.utilities
  icon: build/oli-electron.icns
  # Ad-hoc signing (no Developer ID). macOS still requires codesign -s - (the minimum),
  # but with hardenedRuntime: false there is no W^X enforcement, so V8 JIT works freely.
  # Users must right-click → Open to bypass Gatekeeper on first launch.
  identity: null
  hardenedRuntime: false
  # Entitlements for location services
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Add location usage description to Info.plist
  extendInfo:
    NSLocationWhenInUseUsageDescription: "o|i Lab uses your location to visualize the network path from your device to the video server."
    NSLocationUsageDescription: "o|i Lab uses your location to visualize the network path from your device to the video server."
  target:
    - dmg
    - zip

win:
  target:
    - nsis
    - portable

linux:
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
