name: Submodule Branch Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check-submodule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.OLI_GH_TOKEN }}

      - name: Check submodule branch alignment
        run: bash .scripts/check-submodule.sh
