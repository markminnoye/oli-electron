name: Build macOS

on:
  push:
    branches:
      - main
      - buildfix
      # - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.OLI_GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install webapp dependencies
        run: cd app/app && npm ci

      - name: Build webapp (Vite)
        run: cd app/app && npm run build

      - name: Compile TypeScript (main + preload)
        run: npm run compile

      - name: Package with electron-builder
        run: npx electron-builder --mac --publish onTag
        env:
          # No code-signing: ad-hoc only (identity: "-" in electron-builder.yml)
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.OLI_GH_TOKEN }}
