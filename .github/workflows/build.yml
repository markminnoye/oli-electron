name: Build Desktop Apps

on:
  push:
    branches:
      - main
      # - develop
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish artifacts to GitHub Releases"
        type: boolean
        default: false

jobs:
  build-mac:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.OLI_GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install webapp dependencies
        run: cd app/app && npm ci

      - name: Build webapp (Vite)
        run: cd app/app && npm run build

      - name: Compile TypeScript (main + preload)
        run: npm run compile

      - name: Package with electron-builder
        run: |
          if [ "${{ github.event.inputs.publish }}" = "true" ]; then
            npx electron-builder --mac --publish always
          else
            npx electron-builder --mac --publish onTag
          fi
        env:
          # No code-signing: ad-hoc only (identity: "-" in electron-builder.yml)
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.OLI_GH_TOKEN }}

  build-win:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.OLI_GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install webapp dependencies
        run: cd app/app && npm ci

      - name: Build webapp (Vite)
        run: cd app/app && npm run build

      - name: Compile TypeScript (main + preload)
        run: npm run compile

      - name: Package with electron-builder
        shell: bash
        run: |
          if [ "${{ github.event.inputs.publish }}" = "true" ]; then
            npx electron-builder --win --publish always
          else
            npx electron-builder --win --publish onTag
          fi
        env:
          GH_TOKEN: ${{ secrets.OLI_GH_TOKEN }}
